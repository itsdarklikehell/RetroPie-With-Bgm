name: ShellCheck

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@0.1.0
        with:
          scandir: "."
          format: gcc
        env:
          SHELLCHECK_OPTS: "-e SC1090 -e SC1091"
